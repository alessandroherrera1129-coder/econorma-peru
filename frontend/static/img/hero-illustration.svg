<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#0D9488" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F0FDF4" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="640" height="460" rx="24" fill="url(#bgGlow)" />
  
  <!-- Subtle Grid Telemetry lines -->
  <g stroke="#64748B" stroke-width="0.7" stroke-opacity="0.15">
    <line x1="40" y1="60" x2="600" y2="60" stroke-dasharray="4 4" />
    <line x1="40" y1="140" x2="600" y2="140" stroke-dasharray="4 4" />
    <line x1="40" y1="220" x2="600" y2="220" stroke-dasharray="4 4" />
    <line x1="40" y1="300" x2="600" y2="300" stroke-dasharray="4 4" />
    <line x1="40" y1="380" x2="600" y2="380" stroke-dasharray="4 4" />
    
    <line x1="120" y1="40" x2="120" y2="420" stroke-dasharray="4 4" />
    <line x1="240" y1="40" x2="240" y2="420" stroke-dasharray="4 4" />
    <line x1="360" y1="40" x2="360" y2="420" stroke-dasharray="4 4" />
    <line x1="480" y1="40" x2="480" y2="420" stroke-dasharray="4 4" />
  </g>

  <!-- Abstract Stylized Topographic / Peru Geographic Contour -->
  <path d="M 280 90 Q 340 70 390 110 T 460 210 T 430 330 T 360 380 T 260 340 T 210 240 T 240 140 Z" fill="none" stroke="#10B981" stroke-width="1.8" stroke-opacity="0.4" stroke-dasharray="8 6" />
  <path d="M 295 115 Q 340 100 375 130 T 430 210 T 405 305 T 350 345 T 275 315 T 235 240 T 260 160 Z" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Environmental Fluid Stream (Water & Atmosphere) -->
  <path d="M 60 260 C 180 180 260 340 400 240 C 480 180 540 220 600 170" fill="none" stroke="url(#streamGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 60 285 C 170 210 270 360 410 265 C 490 205 550 245 600 195" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.5" stroke-linecap="round" />

  <!-- Soil Stratum Horizon -->
  <path d="M 80 390 Q 220 370 360 395 T 580 385" fill="none" stroke="#854D0E" stroke-width="3" stroke-dasharray="5 3" stroke-opacity="0.4" />
  <path d="M 80 405 Q 220 385 360 410 T 580 400" fill="none" stroke="#713F12" stroke-width="2" stroke-opacity="0.3" />

  <!-- Floating Analytical Data Card 1: ECA Agua Cat 1 (Top Left) -->
  <g transform="translate(60, 70)" filter="url(#softShadow)">
    <rect width="180" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="12" y="14" width="8" height="8" rx="4" fill="#0284C7" />
    <text x="26" y="22" font-family="system-ui" font-size="11" font-weight="700" fill="#0F172A">ECA Agua · Cat. 1</text>
    <text x="14" y="42" font-family="system-ui" font-size="13" font-weight="600" fill="#334155">Arsénico (As)</text>
    <text x="14" y="66" font-family="system-ui" font-size="20" font-weight="800" fill="#0F766E">0.01 <tspan font-size="11" font-weight="500" fill="#64748B">mg/L</tspan></text>
    <rect x="110" y="52" width="56" height="20" rx="6" fill="#DCFCE7" />
    <text x="138" y="66" font-family="system-ui" font-size="10" font-weight="700" fill="#15803D" text-anchor="middle">VIGENTE</text>
  </g>

  <!-- Floating Analytical Data Card 2: ECA Aire PM2.5 (Top Right) -->
  <g transform="translate(410, 50)" filter="url(#softShadow)">
    <rect width="170" height="90" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="12" y="14" width="8" height="8" rx="4" fill="#10B981" />
    <text x="26" y="22" font-family="system-ui" font-size="11" font-weight="700" fill="#0F172A">ECA Aire · 24 horas</text>
    <text x="14" y="42" font-family="system-ui" font-size="13" font-weight="600" fill="#334155">Material PM2.5</text>
    <text x="14" y="66" font-family="system-ui" font-size="20" font-weight="800" fill="#0284C7">50 <tspan font-size="11" font-weight="500" fill="#64748B">µg/m³</tspan></text>
    <rect x="100" y="52" width="56" height="20" rx="6" fill="#E0F2FE" />
    <text x="128" y="66" font-family="system-ui" font-size="9" font-weight="700" fill="#0369A1" text-anchor="middle">D.S. 003-2017</text>
  </g>

  <!-- Floating Analytical Data Card 3: VMA Saneamiento DBO5 (Bottom Right) -->
  <g transform="translate(380, 280)" filter="url(#softShadow)">
    <rect width="190" height="95" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
    <rect x="12" y="14" width="8" height="8" rx="4" fill="#8B5CF6" />
    <text x="26" y="22" font-family="system-ui" font-size="11" font-weight="700" fill="#0F172A">VMA · Alcantarillado</text>
    <text x="14" y="44" font-family="system-ui" font-size="13" font-weight="600" fill="#334155">DBO5 (Anexo 1)</text>
    <text x="14" y="70" font-family="system-ui" font-size="21" font-weight="800" fill="#7C3AED">500 <tspan font-size="11" font-weight="500" fill="#64748B">mg/L</tspan></text>
    <rect x="110" y="56" width="66" height="20" rx="6" fill="#F3E8FF" />
    <text x="143" y="70" font-family="system-ui" font-size="9" font-weight="700" fill="#6B21A8" text-anchor="middle">D.S. 010-2019</text>
  </g>

  <!-- Central Scientific Sensor / Compass Node -->
  <g transform="translate(280, 200)">
    <circle cx="40" cy="40" r="42" fill="#FFFFFF" filter="url(#softShadow)" />
    <circle cx="40" cy="40" r="34" fill="none" stroke="#10B981" stroke-width="2" />
    <circle cx="40" cy="40" r="28" fill="#064E3B" />
    <!-- Leaf / Droplet Symbol in center -->
    <path d="M 40 22 C 28 30 25 46 33 54 C 37 50 40 44 40 36 Z" fill="#10B981" />
    <path d="M 40 22 C 40 30 45 37 49 43 C 53 49 52 56 44 58 C 49 56 54 50 54 41 C 54 30 46 24 40 22 Z" fill="#38BDF8" />
  </g>

  <!-- Interactive Pulse Signals -->
  <circle cx="320" cy="240" r="54" fill="none" stroke="#10B981" stroke-width="1.2" opacity="0.4">
    <animate attributeName="r" values="44;68" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
