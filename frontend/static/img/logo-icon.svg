<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  
  <!-- Outer Normative Ring / Hexagon Shield -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#leafGrad)" stroke-width="2.5" opacity="0.3" stroke-dasharray="6 4" />
  
  <!-- Modern Geometric Leaf (Left Wing) -->
  <path d="M 50 14 C 28 28 22 56 36 78 C 42 70 48 58 50 42 C 50 30 50 20 50 14 Z" fill="url(#leafGrad)" />
  
  <!-- Crystal Water Droplet & Dynamic Wave (Right Wing) -->
  <path d="M 50 14 C 50 28 58 42 66 54 C 74 66 72 80 58 86 C 68 84 78 72 78 56 C 78 34 62 20 50 14 Z" fill="url(#waterGrad)" />
  
  <!-- Central Regulatory Scale / Core Lens -->
  <circle cx="50" cy="52" r="9" fill="#FFFFFF" />
  <circle cx="50" cy="52" r="6.5" fill="url(#shieldGrad)" />
  <circle cx="50" cy="52" r="2.5" fill="#38BDF8" />
  
  <!-- Analytical Precision Coordinate Nodes -->
  <circle cx="36" cy="78" r="2.5" fill="#10B981" />
  <circle cx="58" cy="86" r="2.5" fill="#0284C7" />
  <circle cx="50" cy="14" r="2.5" fill="#34D399" />
</svg>
